plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.example.fitux"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fitux"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    // ✅ Compose Compiler 1.5.13 is compatible with Kotlin 1.9.23
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.13"
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.material3:material3"

    // Not in the BOM → keep versions
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1"

    // Wear Compose (optional)
    implementation "androidx.wear.compose:compose-material:1.3.1"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Material Components (for XML theme parent)
    implementation "com.google.android.material:material:1.12.0"

    // Optional
    // implementation "com.google.accompanist:accompanist-permissions:0.34.0"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

kotlin {
    jvmToolchain(17)
}
